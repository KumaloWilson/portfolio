services:
  frontend:
    image: wilson-portfolio-frontend:latest
    container_name: wilson-portfolio-frontend
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - app_env
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:10001:10001"
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /app/.next/server:rw,noexec,nosuid,size=256m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:10001,path:'/',headers:{Host:'wilsonkumalo.dev'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  app_env:
    file: .env
